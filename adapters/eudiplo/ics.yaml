# Implementation Conformance Statement of EUDIPLO as Relying Party (see fcaf-overlay/docs/fcaf/ics-rp.md).
# Values as configured by the EUDIPLO adapter.
RP.G.1: "Yes"   # requests credentials in IETF SD-JWT VC format
RP.G.2: "Yes"   # requests credentials in ISO/IEC 18013-5 mdoc format
RP.G.3: "Yes"   # QEAA: etsi_tl Trusted List (format trusted-list), the test LOTL pinned to its signing certificates
RP.G.4: "Yes"   # PuB-EAA: etsi_tl trust list TL-PUB, PubEAA/Issuance services
RP.G.5: "Yes"   # non-qualified EAA: the rulebook anchor CA-EP-A in a trust list of the tenant
RP.G.6: API     # GET /api/session/:id
RP.P.1: "Yes"   # presentations via redirects
RP.P.2: "Yes"   # W3C Digital Credentials API: dc-api offers, answered on the adapter's page
RP.P.3: "No"    # VP_REMOVE_TA strips trusted_authorities from the request
RP.P.4: 60      # T_skew: skewSeconds, EUDIPLO default 60
RP.P.5: "Yes"
RP.P.6: 300     # T_kb: KB-JWT iat at most 300 s old
RP.P.7: PT60S   # T_tx: lifeTime of the presentation configurations, set by the adapter
RP.P.8: "No"    # request_uri_method is always get
RP.P.9: "No"    # EUDIPLO is a back end: the relying service compares the response_code with the session's responseCode
RP.P.10: "No"   # no attribute-based binding of combined presentations
RP.P.11: 10485760  # body parser limit 10mb (main.helpers.ts configureBodyParsers)
RP.P.12: Accept  # does not evaluate the PID expiry date
RP.P.13: "No"   # does not compare the iss of an SD-JWT VC with the SANs of its signing certificate (IssuerIntegrity_038-040 accepted, run of 2026-11-27)
RP.P.14: "Yes"  # rejects an mdoc whose IssuerAuth declares ES384 over a P-256 document signer key (IssuerIntegrity_041 rejected, run of 2026-11-27)
RP.R.1: "Yes"   # statusCheckMode strict
RP.R.2: Reject
RP.R.3: None
RP.R.4: 10485760
RP.R.5: "Yes"   # caches status list tokens for their ttl (at most 1 h; 5 min without ttl)
RP.R.6: PT10S   # STATUS_LIST_TIMEOUT_MS (status-list-verifier.service.ts)
RP.R.7: None    # checks only that iat is present (status-list-verifier.service.ts)
RP.R.8: "Yes"   # Status List JWT verification refuses an iat in the future ("JWT is not yet valid")
RP.R.9: "Yes"   # statusCheckMode strict applies to every credential, whatever its category
RP.T.1: PT5M    # trust list cache
RP.T.2: PT0S
RP.T.4: Discard  # a list whose seal fails is discarded with the cached one (trust-store.service.ts); fail-closed by design, and the adapter's refreshTrust (DELETE /api/cache/trust-list) empties the cache itself
