# Implementation Conformance Statement of EUDIPLO as Relying Party (see fcaf-overlay/docs/fcaf/ics-rp.md).
# Values as configured by the EUDIPLO adapter.
RP.G.1: "Yes"   # requests credentials in IETF SD-JWT VC format
RP.G.2: "Yes"   # requests credentials in ISO/IEC 18013-5 mdoc format
RP.G.3: "No"    # EUDIPLO loads no ETSI TS 119 612 Trusted List (XML), so it cannot trust QEAAs (finding: ARF OIA_13, OIA_15b)
RP.G.4: "Yes"   # PuB-EAA: etsi_tl trust list TL-PUB, PubEAA/Issuance services
RP.G.5: "Yes"   # non-qualified EAA: the rulebook anchor CA-EP-A in a trust list of the tenant
RP.G.6: API     # GET /api/session/:id
RP.P.1: "Yes"   # presentations via redirects
RP.P.2: "Yes"   # W3C Digital Credentials API: dc-api offers, answered on the adapter's page
RP.P.3: "No"    # VP_REMOVE_TA strips trusted_authorities from the request
RP.P.4: 60      # T_skew: skewSeconds, EUDIPLO default 60
RP.P.5: "Yes"
RP.P.6: 300     # T_kb: KB-JWT iat at most 300 s old
RP.R.1: "Yes"   # statusCheckMode strict
RP.R.2: Reject
RP.R.3: None
RP.R.4: 10485760
RP.T.1: PT5M    # trust list cache
RP.T.2: PT0S
