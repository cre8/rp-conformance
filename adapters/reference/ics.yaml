# Implementation Conformance Statement of the reference Relying Party (see fcaf-overlay/docs/fcaf/ics-rp.md).
RP.G.1: "Yes"   # requests credentials in IETF SD-JWT VC format
RP.G.2: "Yes"   # requests credentials in ISO/IEC 18013-5 mdoc format
RP.G.3: "Yes"   # QEAA: granted EAA/Q services of the Trusted Lists the test LOTL points to
RP.G.4: "Yes"   # PuB-EAA: PubEAA/Issuance services of TL-PUB
RP.G.5: "Yes"   # non-qualified EAA: the anchor the rulebook of default_credential_eaa defines
RP.G.6: API
RP.P.1: "Yes"   # presentations via redirects
RP.P.2: "Yes"   # W3C Digital Credentials API: its own page, openid4vp-v1-signed, dc_api.jwt
RP.P.3: "Yes"   # enforces trusted_authorities (type aki) of its own query
RP.P.4: 60      # T_skew, seconds
RP.P.5: "Yes"
RP.P.6: 300     # T_kb, seconds
RP.P.7: PT30S   # T_tx: transaction lifetime
RP.P.8: "Yes"   # request_uri_method post, wallet_nonce echoed
RP.P.9: "Yes"   # front end /done/<id> redeems the response code once, for the user session that started the transaction
RP.P.10: "Yes"  # attribute-based binding of combined presentations: family name, given name, birth date
RP.P.11: 1048576  # maximum Authorization Response size, bytes
RP.P.12: Reject  # PID whose administrative expiry date has passed
RP.P.13: "Yes"  # rejects an SD-JWT VC whose signing certificate does not name its iss (URI SAN, or its URL host as DNS SAN where it has no URI SAN; no iss, no check)
RP.P.14: "Yes"  # rejects an mdoc whose IssuerAuth declares ES384 over a P-256 document signer key (it accepts only ES256 with P-256)
RP.R.1: "Yes"   # checks the revocation status of PIDs
RP.R.2: Reject
RP.R.3: None
RP.R.4: 1048576
RP.R.5: "Yes"   # caches Status List Tokens for their ttl
RP.R.6: PT5S    # status list retrieval timeout
RP.R.7: P7D     # maximum age of a Status List Token by its iat
RP.R.8: "Yes"   # refuses a Status List Token iat in the future
RP.R.9: "Yes"   # checks the revocation status of QEAAs, PuB-EAAs and non-qualified EAAs, as of PIDs
RP.T.1: PT1H
RP.T.2: PT1H    # grace period G: a stale list is used and signalled as trust-list-stale
RP.T.3: "Yes"
RP.T.4: Keep    # a version whose seal fails is not loaded; the last valid one stays in use
