name: Issuer reference run

# The reference run of the issuer suite (issuer harness design sections 5.5, 7 level 3 and 8): every executable issuer
# test case against EUDIPLO as reference PID Provider, at the pinned image the issuer suite is validated against. A
# FAIL listed in adapters/issuer-eudiplo/known-findings.yaml is reported as a known finding and does not fail the job;
# any other FAIL, an INCONCLUSIVE or REVIEW result, or a harness error does. It needs Docker, so it is not part of
# `pnpm test`; it runs on every pull request that touches the issuer suite or what it shares with the RP suite.

on:
  pull_request:
    paths:
      - packages/issuer-*/**
      - packages/wallet-provider/**
      - packages/core/src/issuer/**
      - packages/controller/**
      - packages/validator/**
      - packages/forge/**
      - adapters/issuer-eudiplo/**
      - adapters/eudiplo/docker-compose.yml
      - pnpm-lock.yaml
      - .github/workflows/issuer-reference.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issuer-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eudiplo:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # issue 26: the T_chain waits (7 min); issue 27: PID and the three Attestation Provider tenants in parallel, measured 13 min (775 s) locally
    env:
      # The reference issuer (decision of 2026-11-20) is pinned in adapters/issuer-eudiplo/reference.env, the one place
      # that names it (EUDIPLO_IMAGE, EUDIPLO_EXPECT_VERSION); the first step loads it.
      # Docker Library image from Amazon ECR Public, which has no anonymous pull limit like Docker Hub.
      POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16
      COMPOSE_FILE: adapters/eudiplo/docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reference image (adapters/issuer-eudiplo/reference.env)
        run: grep -E '^[A-Z_]+=' adapters/issuer-eudiplo/reference.env >> "$GITHUB_ENV"
      - name: Start EUDIPLO with PostgreSQL
        run: docker compose up -d --wait
      - name: Image under test
        run: |
          revision=$(docker image inspect "$EUDIPLO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          version=$(docker image inspect "$EUDIPLO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "EUDIPLO \`$EUDIPLO_IMAGE\`: version \`$version\`, revision \`$revision\`" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$revision" = "$EUDIPLO_REVISION" || { echo "::error::image revision $revision is not the pinned $EUDIPLO_REVISION"; exit 1; }
      - name: Issuer suite against EUDIPLO
        run: >-
          pnpm eudi-pcaf issuer run --adapter eudiplo
          --ics adapters/issuer-eudiplo/ics.yaml
          --known-findings adapters/issuer-eudiplo/known-findings.yaml
          --report-dir reports
      - name: Summary
        if: always()
        run: |
          for summary in reports/*/summary.md; do [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"; done
      - name: EUDIPLO log
        if: always()
        run: mkdir -p reports && docker compose logs --no-color --timestamps eudiplo > reports/eudiplo.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issuer-reference-eudiplo-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop EUDIPLO
        if: always()
        run: docker compose down -v
