name: Nightly EUDIPLO

# Runs every executable test case against EUDIPLO's latest main image (harness design section 8). A FAIL listed in
# adapters/eudiplo/known-findings.yaml shows in the report and the JUnit XML as a known finding but does not fail the
# job; any other FAIL, an INCONCLUSIVE or REVIEW result, or a harness error does.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: EUDIPLO image under test
        default: ghcr.io/eudiplo/eudiplo:main
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-eudiplo
  cancel-in-progress: false

jobs:
  eudiplo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EUDIPLO_IMAGE: ${{ inputs.image || 'ghcr.io/eudiplo/eudiplo:main' }}
      # Docker Library image from Amazon ECR Public: Docker Hub's anonymous pull limit, shared by the runners, has broken
      # CI before.
      POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16
      COMPOSE_FILE: adapters/eudiplo/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium (headless shell) of the DC API shim
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium and its system libraries
        run: pnpm playwright:install --with-deps
      - name: Start EUDIPLO with PostgreSQL
        run: docker compose up -d --wait
      - name: Image under test
        run: |
          revision=$(docker image inspect "$EUDIPLO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          digest=$(docker image inspect "$EUDIPLO_IMAGE" --format '{{index .RepoDigests 0}}')
          created=$(docker image inspect "$EUDIPLO_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')
          echo "EUDIPLO \`$EUDIPLO_IMAGE\`: revision \`$revision\`, \`$digest\`, built $created" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run every test case in both flows
        run: pnpm rp-conformance run --adapter eudiplo --known-findings adapters/eudiplo/known-findings.yaml --report-dir reports
      - name: Summary
        if: always()
        run: |
          for summary in reports/*/summary.md; do [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"; done
      - name: EUDIPLO log
        if: always()
        run: docker compose logs --no-color --timestamps eudiplo > reports/eudiplo.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rp-conformance-eudiplo-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop EUDIPLO
        if: always()
        run: docker compose down -v
