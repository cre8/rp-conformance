# EUDIPLO as the Relying Party under test, with PostgreSQL (harness design section 8).
#
#   docker compose -f adapters/eudiplo/docker-compose.yml up -d --wait
#   pnpm rp-conformance run --adapter eudiplo --only RP_WS_IA_MainInteraction_001a
#
# The harness services run on the host; EUDIPLO reaches them as host.docker.internal. EUDIPLO is published on
# 127.0.0.1 only, and its PUBLIC_URL (request_uri, response_uri) names 127.0.0.1 rather than localhost: localhost may
# resolve to ::1 first, where another process can listen on the same port. EUDIPLO_PORT moves the host port, for a
# second stack next to this one (with another project name: docker compose -p <name>).
name: rp-conformance-eudiplo

services:
  eudiplo:
    image: ${EUDIPLO_IMAGE:-ghcr.io/eudiplo/eudiplo:latest}
    ports:
      - '127.0.0.1:${EUDIPLO_PORT:-3000}:3000'
    environment:
      PUBLIC_URL: http://127.0.0.1:${EUDIPLO_PORT:-3000}
      MASTER_SECRET: rp-conformance-test-master-secret-not-for-production
      AUTH_CLIENT_ID: rp-conformance
      AUTH_CLIENT_SECRET: rp-conformance-secret
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: eudiplo
      DB_PASSWORD: eudiplo
      DB_DATABASE: eudiplo
      # The Test Status Provider and the Test Trust Infrastructure run on the host, over plain HTTP in Phase 0.
      OUTBOUND_URL_ALLOW_HTTP: 'true'
      OUTBOUND_URL_ALLOW_PRIVATE_NETWORK: 'true'
      # default_query_pid carries no trusted_authorities; EUDIPLO uses them for its own trust decision only.
      VP_REMOVE_TA: 'true'
      LOG_LEVEL: debug
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    # The Docker Library image from Amazon ECR Public, which has no anonymous pull limit like Docker Hub.
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16}
    environment:
      POSTGRES_USER: eudiplo
      POSTGRES_PASSWORD: eudiplo
      POSTGRES_DB: eudiplo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eudiplo']
      interval: 2s
      timeout: 5s
      retries: 30
