name: Pages

# Builds the site (scripts/site-build.sh) and deploys it to GitHub Pages from main. Pull requests that touch it only
# build it, so a change that breaks the build fails there.
on:
  push:
    branches: [main]
    paths: &site-paths
      - fcaf-overlay/docs/**
      - website/**
      - scripts/site-build.sh
      - scripts/fcaf-upstream.sh
      - .github/workflows/pages.yml
  pull_request:
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: scripts/site-build.sh "$RUNNER_TEMP/site"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
