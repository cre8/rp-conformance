# Configuration of the GitHub Pages site of the Peer Conformance Assessment Framework (PCAF). scripts/site-build.sh
# copies it next to the FCAF configuration as mkdocs.rp.yml. It inherits the FCAF theme, Markdown extensions, hooks and
# assets, and replaces everything that would present the site as the European Commission's: name, author, URL,
# repository, logo, colours, navigation and copyright. MkDocs merges mappings key by key and replaces lists as a whole.
INHERIT: mkdocs.yml

site_name: Peer Conformance (PCAF)
site_description: Functional conformance test cases for the peers of the EUDI Wallet (Relying Parties, PID Providers and Attestation Providers) in the FCAF format, and the harness that runs them. Unofficial draft.
site_author: rp-conformance
site_url: https://rp-conformance.eudi-wallet.dev/
repo_url: https://github.com/cre8/rp-conformance
repo_name: cre8/rp-conformance
# The pages are rendered from packages/definitions, packages/issuer-definitions and the FCAF branches, so there is
# nothing to edit here.
edit_uri: ""
copyright: >-
  rp-conformance, EUPL-1.2. FCAF content © European Union, EUPL-1.2.
  Not a publication of the European Commission.

theme:
  # The FCAF uses the EUDI logo and favicon.
  logo: null
  favicon: assets/images/favicon.png
  icon:
    logo: material/shield-check-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  # As the FCAF, without the edit and view-source actions.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

# As the FCAF, with rp.css (copied by scripts/site-build.sh), which replaces the Commission's colours.
extra_css:
  - media/css/extra.css
  - media/css/fcaf.css
  - media/css/rp.css

# As the FCAF, without mike: one version, deployed by .github/workflows/pages.yml.
plugins:
  - search
  - tags
  - privacy
  - include-markdown

# As the FCAF, without fcaf_edit_urls.py, which points the edit actions at the FCAF branches, and without fcaf_nav.py:
# the navigation below replaces the FCAF's content navigation (docs/fcaf/.nav.yml), which lists the Wallet Solution.
hooks:
  - hooks/precond_alpha.py

extra:
  version: null

# The framework pages are the site-only layer (website/pcaf, scripts/site-layer.py); the SUT pages come from the
# overlays. The Wallet Solution pages of the FCAF are not part of the site.
nav:
  - Home: index.md
  - Framework:
      - Introduction: pcaf/introduction.md
      - Terminology: pcaf/terminology.md
      - Methodology: pcaf/index.md
      - Using the framework: pcaf/using-pcaf.md
      - Defaults: pcaf/defaults.md
      - ICS (Relying Party): pcaf/ics-rp.md
      - ICS (PID and Attestation Provider): pcaf/ics-issuer.md
      - References: pcaf/references.md
  - Test cases:
      - Overview: pcaf/suts/index.md
      - Relying Party (SUT):
          - Overview: pcaf/suts/relying_party/index.md
          - (rp_ws) Wallet Solution:
              - Overview: pcaf/suts/relying_party/wallet_solution/rp_ws.md
              - Baseline tests: pcaf/suts/relying_party/wallet_solution/baseline-tests.md
              - Test cases: pcaf/suts/relying_party/wallet_solution/test-cases.md
          - (rp_pp) PID Provider:
              - Overview: pcaf/suts/relying_party/pid_provider/rp_pp.md
              - Baseline tests: pcaf/suts/relying_party/pid_provider/baseline-tests.md
              - Test cases: pcaf/suts/relying_party/pid_provider/test-cases.md
          - (rp_inf) Trust Infrastructure:
              - Overview: pcaf/suts/relying_party/infrastructure/rp_inf.md
              - Baseline tests: pcaf/suts/relying_party/infrastructure/baseline-tests.md
              - Test cases: pcaf/suts/relying_party/infrastructure/test-cases.md
      - PID Provider (SUT):
          - Overview: pcaf/suts/pid_provider/index.md
          - (pp_ws) Wallet Solution:
              - Overview: pcaf/suts/pid_provider/wallet_solution/pp_ws.md
              - Test cases: pcaf/suts/pid_provider/wallet_solution/test-cases.md
          - (pp_rp) Relying Party:
              - Overview: pcaf/suts/pid_provider/relying_party/pp_rp.md
              - Test cases: pcaf/suts/pid_provider/relying_party/test-cases.md
          - (pp_inf) Trust Infrastructure:
              - Overview: pcaf/suts/pid_provider/infrastructure/pp_inf.md
              - Test cases: pcaf/suts/pid_provider/infrastructure/test-cases.md
      - Attestation Provider (SUT):
          - Overview: pcaf/suts/attestation_provider/index.md
          - (ap_ws) Wallet Solution:
              - Overview: pcaf/suts/attestation_provider/wallet_solution/ap_ws.md
              - Test cases: pcaf/suts/attestation_provider/wallet_solution/test-cases.md
          - (ap_rp) Relying Party:
              - Overview: pcaf/suts/attestation_provider/relying_party/ap_rp.md
              - Test cases: pcaf/suts/attestation_provider/relying_party/test-cases.md
          - (ap_inf) Trust Infrastructure:
              - Overview: pcaf/suts/attestation_provider/infrastructure/ap_inf.md
              - Test cases: pcaf/suts/attestation_provider/infrastructure/test-cases.md
  # The project documents of both suites, copied by scripts/site-project-pages.py: the same pages for each.
  - Test suites:
      - Relying Party suite:
          - Overview: rp/index.md
          - Test catalogue: rp/rp-test-catalogue.md
          - Harness design: rp/harness-design.md
          - EUDIPLO reference verifier:
              - ICS: rp/eudiplo/ics.md
              - Known findings: rp/eudiplo/known-findings.md
              - Upstream findings: rp/eudiplo/upstream-findings/index.md
      - Issuer suite:
          - Overview: issuer/index.md
          - Test catalogue: issuer/issuer-test-catalogue.md
          - Harness design: issuer/issuer-harness-design.md
          - EUDIPLO reference issuer:
              - Adapter: issuer/eudiplo/index.md
              - ICS: issuer/eudiplo/ics.md
              - Known findings: issuer/eudiplo/known-findings.md
              - Upstream findings: issuer/eudiplo/upstream-findings/index.md
  - Repository: https://github.com/cre8/rp-conformance
  - Official FCAF: https://conformance.eudi.dev
